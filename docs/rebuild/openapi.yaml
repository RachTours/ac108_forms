openapi: 3.1.0
info:
  title: ReviewRoom API
  version: 1.0.0
  description: >-
    Shared request and response shapes are defined in packages/contracts/src.
    This file documents the stable /api/v1 route families and representative
    examples; API handlers must validate requests with those schemas/use cases.
servers:
  - url: https://api.example.invalid/api/v1
tags:
  - name: Auth
  - name: Members
  - name: Targets
  - name: Assignments
  - name: Forms
  - name: Public review
paths:
  /health/live:
    get:
      tags: [Auth]
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: ok }
  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Create an admin-audience session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: admin@example.com, password: 'not-a-real-password' }
      responses:
        '200':
          description: Sets the admin session cookie.
          headers:
            Set-Cookie: { schema: { type: string }, description: HttpOnly, Secure in production, audience-scoped cookie. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '409':
          description: Workspace selection required for identities in multiple workspaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceChoiceResponse' }
        '429': { $ref: '#/components/responses/ApiError' }
  /auth/reviewer/login:
    post:
      tags: [Auth]
      summary: Create a reviewer-audience session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sets the reviewer session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
  /auth/session:
    get:
      tags: [Auth]
      summary: Read the active audience session
      security: [{ adminSession: [] }, { reviewerSession: [] }]
      responses:
        '200':
          description: Authenticated membership projection; never includes credential material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/ApiError' }
  /members:
    get:
      tags: [Members]
      summary: List workspace memberships without password hashes
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Bounded membership summaries. }
        '403': { $ref: '#/components/responses/ApiError' }
  /members/invitations:
    post:
      tags: [Members]
      summary: Issue a one-time invitation
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, REVIEWER] }
      responses:
        '201': { description: Created invitation. Clear token is revealed only in the one-time invite URL response. }
        '403': { $ref: '#/components/responses/ApiError' }
  /review-targets:
    get:
      tags: [Targets]
      summary: List organization targets
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Target summaries with read-only assignment context. }
        '403': { $ref: '#/components/responses/ApiError' }
  /assignments:
    get:
      tags: [Assignments]
      summary: List target assignment states
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - { in: query, name: state, schema: { type: string, enum: [all, assigned, unassigned], default: all } }
        - { in: query, name: reviewerId, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Bounded tenant-scoped page and counts. }
        '403': { $ref: '#/components/responses/ApiError' }
  /assignments/{targetId}:
    put:
      tags: [Assignments]
      summary: Assign or reassign a target with optimistic concurrency
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: targetId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentSetRequest' }
            example: { reviewerId: 8d493e2d-7500-4d5f-a148-05a7ff2127d0, expectedUpdatedAt: null }
      responses:
        '200': { description: Assignment state and changed flag. }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /forms:
    get:
      tags: [Forms]
      summary: List forms
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Bounded form summaries. }
  /forms/{formId}/publish:
    post:
      tags: [Forms]
      summary: Publish a validated immutable form version
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: formId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Newly published immutable version. }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /public/review/{token}:
    get:
      tags: [Public review]
      summary: Resolve an active reviewer-bound public link
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, minLength: 40, maxLength: 100 } }
      responses:
        '200': { description: Minimal public form, theme and currently assigned targets. }
        '404': { description: Link unavailable, revoked, expired, or not authorized for requested work. }
  /public/review/{token}/submissions:
    post:
      tags: [Public review]
      summary: Submit a response against the exact published version
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, minLength: 40, maxLength: 100 } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicSubmissionRequest' }
      responses:
        '201': { description: Created submission receipt. }
        '200': { description: Idempotent replay of the original receipt. }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    adminSession: { type: apiKey, in: cookie, name: rr_admin_session }
    reviewerSession: { type: apiKey, in: cookie, name: rr_reviewer_session }
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 64, maxLength: 64 }
  responses:
    ApiError:
      description: Stable error with request reference.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }
        organizationSlug: { type: string, minLength: 1, maxLength: 80 }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, organization, role, csrfToken]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        organization:
          type: object
          additionalProperties: false
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 160 }
            slug: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string, enum: [OWNER, ADMIN, REVIEWER] }
        csrfToken: { type: string, minLength: 64, maxLength: 64 }
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 120 }
    WorkspaceChoiceResponse:
      type: object
      additionalProperties: false
      required: [error, data]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { const: WORKSPACE_SELECTION_REQUIRED }
            message: { type: string, minLength: 1, maxLength: 500 }
            requestId: { type: string, minLength: 1, maxLength: 128 }
        data:
          type: object
          additionalProperties: false
          required: [workspaces]
          properties:
            workspaces:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [id, name, slug, role]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, minLength: 1, maxLength: 160 }
                  slug: { type: string, minLength: 1, maxLength: 80 }
                  role: { type: string, enum: [OWNER, ADMIN, REVIEWER] }
    Session:
      type: object
      additionalProperties: false
      required: [user, organizationId, organizationName, membershipId, role, csrfToken]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email, displayName]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            displayName: { type: string, minLength: 1, maxLength: 120 }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string, minLength: 1, maxLength: 160 }
        membershipId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ADMIN, REVIEWER] }
        csrfToken: { type: string, minLength: 64, maxLength: 64 }
    AssignmentSetRequest:
      type: object
      additionalProperties: false
      required: [reviewerId, expectedUpdatedAt]
      properties:
        reviewerId: { type: string, format: uuid }
        expectedUpdatedAt: { type: [string, 'null'], format: date-time }
    PublicSubmissionRequest:
      type: object
      additionalProperties: false
      required: [formId, formVersionId, targetId, answers]
      properties:
        formId: { type: string, format: uuid }
        formVersionId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        answers: { type: object, maxProperties: 100 }
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
            message: { type: string, minLength: 1, maxLength: 500 }
            requestId: { type: string, maxLength: 128 }
