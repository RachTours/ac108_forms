    <text x="1058" y="605" class="small" font-weight="650">80%</text><rect x="1100" y="580" width="124" height="25" rx="13" class="light"/><text x="1162" y="597" text-anchor="middle" font-size="9" fill="#126b53">2 submissions left</text><rect x="1232" y="580" width="130" height="25" rx="13" fill="#edf3f0"/><text x="1297" y="597" text-anchor="middle" font-size="9" fill="#45665a">Assigned work done</text>
    <path d="M302 644h1062" stroke="#e4ebe7"/>
