  <circle cx="42" cy="42" r="19" fill="#17785d"/><text x="36" y="48" font-size="17" font-weight="700" fill="#fff">A</text>
  <text x="72" y="48" font-size="17" font-weight="700">Admin Panel</text>
  <text class="tiny muted" x="28" y="105">WORKSPACE</text>
  <rect x="14" y="122" width="206" height="42" rx="10" fill="#e4f0eb"/><text x="48" y="148" class="small" fill="#126b53">Overview</text>
  <text x="48" y="198" class="small muted">People</text><text x="48" y="246" class="small muted">Submissions</text><text x="48" y="294" class="small muted">Forms</text><text x="48" y="342" class="small muted">Team access</text>
  <rect x="14" y="365" width="206" height="42" rx="10" fill="#e4f0eb"/><text x="48" y="391" class="small" fill="#126b53">Settings</text>
  <text x="274" y="38" class="small muted">Admin Panel　/　Settings</text>
  <circle cx="1382" cy="38" r="19" fill="#678479"/><text x="1374" y="43" font-size="12" font-weight="700" fill="#fff">LA</text>
  <text x="274" y="105" class="tiny" fill="#17785d" letter-spacing="1.4">REVIEW WORKSPACE</text>
  <text x="274" y="146" class="title">Progress goals</text>
  <text x="274" y="173" class="small muted">Set the people target and the submission target independently.</text>

  <rect x="274" y="204" width="550" height="150" rx="16" class="card"/>
  <text x="302" y="241" class="label">People in this review</text>
  <text x="302" y="263" class="small muted">How many people should receive a review?</text>
  <rect x="302" y="284" width="492" height="48" rx="9" fill="#fff" stroke="#cddbd4"/>
  <text x="322" y="315" font-size="18">50</text>
  <text x="754" y="315" class="small muted">people</text>

  <rect x="842" y="204" width="550" height="150" rx="16" class="card"/>
  <text x="870" y="241" class="label">Workspace submission goal</text>
  <text x="870" y="263" class="small muted">Total active submissions across all reviewers.</text>
  <rect x="870" y="284" width="492" height="48" rx="9" fill="#fff" stroke="#cddbd4"/>
  <text x="890" y="315" font-size="18">50</text>
  <text x="1322" y="315" class="small muted">submissions</text>

  <rect x="274" y="374" width="1118" height="84" rx="14" fill="#e7f2ed" stroke="#d6e7de"/>
  <circle cx="310" cy="416" r="17" fill="#fff"/><text x="304" y="421" font-size="16" font-weight="700" fill="#17785d">÷</text>
  <text x="342" y="408" class="label">Shared reviewer goal</text>
  <text x="342" y="432" class="small muted">50 submissions ÷ 5 active reviewers = 10 submissions per reviewer</text>
  <text x="1320" y="423" text-anchor="end" class="small" fill="#126b53">Calculated automatically</text>

  <rect x="274" y="482" width="1118" height="438" rx="16" class="card"/>
  <text x="302" y="520" class="section">Reviewer workload</text>
  <text x="302" y="544" class="small muted">Sort: Completion · Name (A–Z) · Most submissions · Fewest submissions left</text>
  <text x="1206" y="520" class="small muted">Sort by</text>
  <rect x="1252" y="492" width="112" height="38" rx="8" fill="#fff" stroke="#cddbd4"/><text x="1267" y="516" class="small">Completion　⌄</text>
  <path d="M302 566h1062" stroke="#e4ebe7"/>

  <g transform="translate(0 0)">
