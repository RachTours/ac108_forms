<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#18312b}.muted{fill:#71817b}.small{font-size:13px}.tiny{font-size:11px}.title{font-size:28px;font-weight:650}.section{font-size:18px;font-weight:650}.label{font-size:13px;font-weight:600}.value{font-size:29px;font-weight:650}.card{fill:#fff;stroke:#dce6e1;stroke-width:1}.green{fill:#17785d}.light{fill:#e5f1ec}.track{fill:#eef2ef}
    </style>
  </defs>
  <rect width="1440" height="1050" fill="#f3f7f4"/>
  <rect width="236" height="1050" fill="#fff"/>
