    <rect x="600" y="675" width="420" height="9" rx="5" class="track"/><rect x="600" y="675" width="420" height="9" rx="5" class="green"/>
    <text x="1058" y="683" class="small" font-weight="650">100%</text><rect x="1100" y="658" width="124" height="25" rx="13" class="light"/><text x="1162" y="675" text-anchor="middle" font-size="9" fill="#126b53">Goal met</text><rect x="1232" y="658" width="130" height="25" rx="13" fill="#edf3f0"/><text x="1297" y="675" text-anchor="middle" font-size="9" fill="#45665a">1 assigned remaining</text>
    <path d="M302 722h1062" stroke="#e4ebe7"/>
  </g>
  <g>
    <circle cx="328" cy="760" r="19" fill="#e5f1ec"/><text x="322" y="765" class="small" font-weight="700">R</text>
