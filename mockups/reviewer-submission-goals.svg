    <rect x="600" y="753" width="420" height="9" rx="5" class="track"/><rect x="600" y="753" width="210" height="9" rx="5" class="green"/>
    <text x="1058" y="761" class="small" font-weight="650">50%</text><rect x="1100" y="736" width="124" height="25" rx="13" fill="#f5f1e6"/><text x="1162" y="753" text-anchor="middle" font-size="9" fill="#786126">5 submissions left</text><rect x="1232" y="736" width="130" height="25" rx="13" fill="#f5f1e6"/><text x="1297" y="753" text-anchor="middle" font-size="9" fill="#786126">3 assigned remaining</text>
    <path d="M302 800h1062" stroke="#e4ebe7"/>
  </g>
  <g>
    <circle cx="328" cy="838" r="19" fill="#e5f1ec"/><text x="322" y="843" class="small" font-weight="700">R</text>
    <text x="360" y="834" class="label">Reviewer Four</text><text x="360" y="855" class="tiny muted">3 submissions · goal 10</text>
    <rect x="600" y="831" width="420" height="9" rx="5" class="track"/><rect x="600" y="831" width="126" height="9" rx="5" class="green"/>
    <text x="1058" y="839" class="small" font-weight="650">30%</text><rect x="1100" y="814" width="124" height="25" rx="13" fill="#f5f1e6"/><text x="1162" y="831" text-anchor="middle" font-size="9" fill="#786126">7 submissions left</text><rect x="1232" y="814" width="130" height="25" rx="13" fill="#f5f1e6"/><text x="1297" y="831" text-anchor="middle" font-size="9" fill="#78665a">No assignments</text>
  </g>

  <rect x="274" y="944" width="1118" height="74" rx="14" class="card"/>
  <text x="302" y="973" class="label">Workspace submission progress</text>
  <text x="302" y="996" class="small muted">26 of 50 submissions</text>
  <rect x="720" y="978" width="620" height="10" rx="5" class="track"/><rect x="720" y="978" width="322" height="10" rx="5" class="green"/>
  <text x="1362" y="986" text-anchor="end" class="small" font-weight="650">52%</text>
</svg>

